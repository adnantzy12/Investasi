<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Investasi</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f6fa; margin:0; padding:0;">

  <div style="max-width:400px; margin:80px auto; background:white; padding:30px; border-radius:12px; box-shadow:0 0 15px rgba(0,0,0,0.1);">
    <h2 style="text-align:center; color:#2c3e50; margin-bottom:20px;">Login Akun</h2>

    <form action="dashboard.html" method="get">
      <label>Email / Username</label><br>
      <input type="text" name="username" required
        style="width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:8px;"><br>

      <label>Password</label><br>
      <input type="password" name="password" required
        style="width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:8px;"><br>

      <button type="submit"
        style="width:100%; background:#27ae60; color:white; padding:12px; border:none; border-radius:8px; cursor:pointer; font-size:16px;">
        Masuk
      </button>
    </form>

    <p style="text-align:center; margin-top:15px;">
      Belum punya akun? <a href="register.html" style="color:#2980b9; text-decoration:none;">Daftar di sini</a>
    </p>
  </div>

</body>
</html>
