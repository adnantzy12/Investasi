<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Riwayat Transaksi</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f4f6f7; margin:0; padding:0;">

  <!-- Header -->
  <div style="background:#34495e; padding:20px; text-align:center; color:white;">
    <h2>📜 Riwayat Transaksi</h2>
    <p>Lihat semua aktivitas topup, investasi, dan withdraw kamu</p>
  </div>

  <!-- Konten -->
  <div style="max-width:900px; margin:40px auto; background:white; padding:30px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1);">
    
    <table style="width:100%; border-collapse:collapse; text-align:left; font-size:15px;">
      <thead>
        <tr style="background:#2c3e50; color:white;">
          <th style="padding:12px;">Tanggal</th>
          <th style="padding:12px;">Jenis</th>
          <th style="padding:12px;">Jumlah</th>
          <th style="padding:12px;">Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Contoh data dummy -->
        <tr style="border-bottom:1px solid #ecf0f1;">
          <td style="padding:12px;">2025-09-10</td>
          <td style="padding:12px; color:#27ae60; font-weight:bold;">Topup</td>
          <td style="padding:12px;">Rp 500.000</td>
          <td style="padding:12px; color:#27ae60;">✅ Sukses</td>
        </tr>
        <tr style="border-bottom:1px solid #ecf0f1;">
          <td style="padding:12px;">2025-09-12</td>
          <td style="padding:12px; color:#2980b9; font-weight:bold;">Investasi</td>
          <td style="padding:12px;">Plan Rp 1.500.000</td>
          <td style="padding:12px; color:#2980b9;">📈 Berjalan</td>
        </tr>
        <tr style="border-bottom:1px solid #ecf0f1;">
          <td style="padding:12px;">2025-09-15</td>
          <td style="padding:12px; color:#e67e22; font-weight:bold;">Withdraw</td>
          <td style="padding:12px;">Rp 200.000</td>
          <td style="padding:12px; color:#e67e22;">⏳ Diproses</td>
        </tr>
        <tr style="border-bottom:1px solid #ecf0f1;">
          <td style="padding:12px;">2025-09-18</td>
          <td style="padding:12px; color:#27ae60; font-weight:bold;">Topup</td>
          <td style="padding:12px;">Rp 100.000</td>
          <td style="padding:12px; color:#c0392b;">❌ Gagal</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Back -->
  <div style="text-align:center; margin:20px;">
    <a href="dashboard.html" style="background:#2980b9; color:white; padding:12px 18px; border-radius:8px; text-decoration:none;">⬅ Kembali ke Dashboard</a>
  </div>

</body>
</html>
