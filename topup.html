<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Topup Investasi</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f4f6f7; margin:0; padding:0;">

  <!-- Header -->
  <div style="background:#2c3e50; padding:20px; text-align:center; color:white;">
    <h2>💰 Topup Investasi</h2>
    <p>Minimal topup 100K</p>
  </div>

  <!-- Form Topup -->
  <div style="max-width:500px; margin:30px auto; background:white; padding:25px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1);">
    
    <!-- Info Rekening -->
    <div style="background:#ecf0f1; padding:15px; border-radius:10px; margin-bottom:20px;">
      <h3 style="margin:0; color:#2c3e50;">Transfer ke:</h3>
      <p style="margin:5px 0; font-size:15px;">BANK JAGO</p>
      <p style="margin:5px 0; font-weight:bold; color:#27ae60;">105155215555</p>
    </div>

    <form action="konfirmasi.html" method="post" enctype="multipart/form-data">

      <label style="display:block; margin-bottom:8px; font-weight:bold;">Nominal Topup</label>
      <input type="number" name="nominal" placeholder="Minimal 100000" required 
             style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #bdc3c7; border-radius:8px;">

      <label style="display:block; margin-bottom:8px; font-weight:bold;">Upload Bukti Pembayaran</label>
      <input type="file" name="bukti" accept="image/*,.pdf" required
             style="width:100%; padding:8px; margin-bottom:20px;">

      <button type="submit" 
              style="width:100%; background:#27ae60; color:white; padding:12px; border:none; border-radius:8px; font-size:16px; cursor:pointer;">
        Kirim Konfirmasi
      </button>
    </form>
  </div>

  <!-- Back -->
  <div style="text-align:center; margin:30px;">
    <a href="plan.html" style="background:#2980b9; color:white; padding:12px 18px; border-radius:8px; text-decoration:none;">⬅ Kembali ke Plan</a>
  </div>

</body>
</html>
